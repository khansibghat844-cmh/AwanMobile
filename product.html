<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0a1020">
<title>Phone Details | Awan Mobiles</title>
<style>
:root{--bg:#080d19;--panel:#10182a;--panel2:#151f35;--text:#f6f8ff;--muted:#aab6cd;--blue:#4f8cff;--cyan:#55e5dc;--line:rgba(255,255,255,.1);--green:#25d366}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#18294b 0,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,92%);margin:auto}.top{border-bottom:1px solid var(--line);background:#080d19d9;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:900;font-size:19px}.brand span{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#07101f;margin-right:8px}.btn{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(120deg,var(--blue),#6c73ff);color:white;font-weight:800;cursor:pointer}.btn.wa{background:var(--green);color:#06210f}.crumb{color:var(--muted);font-size:13px;padding:22px 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start;padding-bottom:60px}.gallery{position:sticky;top:90px}.mainimage{min-height:420px;border:1px solid var(--line);border-radius:24px;background:radial-gradient(circle at 50% 35%,#324f83,#151e34 63%,#0b1120);display:grid;place-items:center;position:relative;overflow:hidden}.mainimage img{width:100%;height:420px;object-fit:contain;display:none}.phoneart{width:170px;height:315px;border-radius:35px;border:4px solid #aab8d4;background:linear-gradient(150deg,#7e94bc,#202f52 58%,#10182a);position:relative;box-shadow:0 22px 40px #0009}.phoneart:before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:52px;height:13px;background:#060b16;border-radius:12px;z-index:2}.phoneart:after{content:"AWAN MOBILES";position:absolute;inset:24px 9px 9px;border-radius:25px;background:radial-gradient(circle at 45% 30%,#55e5dc,#4263d8 40%,#121b3b 75%);display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:1px}.thumbs{display:flex;gap:10px;margin-top:12px}.thumb{flex:1;min-height:65px;border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:var(--muted);font-size:12px;display:grid;place-items:center;text-align:center;padding:7px}.tag{color:var(--cyan);font-weight:900;font-size:11px;letter-spacing:1.8px;text-transform:uppercase}.hname{font-size:clamp(30px,4vw,43px);line-height:1.1;letter-spacing:-1.2px;margin:8px 0 10px}.desc{color:var(--muted);margin:0 0 20px}.price{font-size:30px;font-weight:900;margin:12px 0 4px}.small{color:var(--muted);font-size:12px}.panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#141f34,#0d1423);padding:18px;margin-top:19px}.panel h2{font-size:18px;margin:0 0 12px}.variants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.variant{border:1px solid var(--line);background:#ffffff07;color:var(--text);padding:12px;border-radius:12px;text-align:left;cursor:pointer;font:inherit}.variant.active{border-color:var(--cyan);background:#55e5dc13}.variant strong{display:block;font-size:13px}.variant small{color:var(--muted)}.specrow{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}.specrow:last-child{border-bottom:0}.specrow span:first-child{color:var(--muted)}.notice{font-size:12px;color:#93a2bd;margin-top:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.actions .btn{flex:1}.footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:12px}.error{padding:60px 0;text-align:center}.error h1{font-size:32px}@media(max-width:760px){.details{grid-template-columns:1fr;gap:22px}.gallery{position:static}.mainimage{min-height:330px}.mainimage img{height:330px}.phoneart{transform:scale(.86)}.nav{height:62px}.hname{font-size:32px}.variants{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html"><span>A</span>AWAN MOBILES</a><a class="btn" href="index.html">← All Phones</a></div></header>
<main class="wrap"><div class="crumb"><a href="index.html">Home</a> / <span id="crumbName">Phone Details</span></div><div id="content"><div class="error"><h1>Loading phone details…</h1></div></div></main>
<footer class="footer"><div class="wrap">© <span id="year"></span> Awan Mobiles · Product details and availability should be confirmed before ordering.</div></footer>
<script src="phones.js"></script><script>
const params=new URLSearchParams(location.search);const id=params.get('id');const phone=window.phoneCatalog.find(p=>p.id===id);const root=document.getElementById('content');document.getElementById('year').textContent=new Date().getFullYear();
if(!phone){root.innerHTML='<div class="error"><h1>Phone not found</h1><p class="desc">This phone may have been removed from the catalogue.</p><a class="btn" href="index.html">Back to Phones</a></div>';}else{
 document.title=phone.name+' | Awan Mobiles';document.getElementById('crumbName').textContent=phone.name;
 const variants=phone.variants||[{label:phone.variant,price:phone.price}];let chosen=0;
 root.innerHTML=`<section class="details"><div class="gallery"><div class="mainimage"><div class="phoneart" id="phoneart"></div><img id="mainphoto" alt="${phone.name} product photo"></div><div class="thumbs"><div class="thumb">Main Photo<br><span class="small">Add your image</span></div><div class="thumb">Back View<br><span class="small">Add your image</span></div><div class="thumb">Side View<br><span class="small">Add your image</span></div></div><p class="notice">Product photos can be added when you send them to me.</p></div><div><div class="tag">${phone.brand} · ${phone.tag}</div><h1 class="hname">${phone.name}</h1><p class="desc">${phone.desc}</p><div class="price" id="price">Price not added</div><div class="small">Price in Pakistani Rupees (PKR)</div><section class="panel"><h2>Select RAM / Storage Variant</h2><div class="variants" id="variants"></div><p class="notice">Only confirmed variants and prices should be published. Send the other variants and prices to add them here.</p></section><section class="panel"><h2>Specifications</h2><div id="specRows"></div><p class="notice">${phone.note}</p></section><div class="actions"><a class="btn wa" id="order" target="_blank" rel="noopener">Order on WhatsApp ↗</a><a class="btn" href="index.html#phones">Back to Phones</a></div></div></section>`;
 const variantBox=document.getElementById('variants');function renderVariants(){variantBox.innerHTML=variants.map((v,i)=>`<button class="variant ${i===chosen?'active':''}" type="button" data-i="${i}"><strong>${v.label}</strong><small>${v.price?'PKR '+Number(v.price).toLocaleString('en-PK'):'Price not added'}</small></button>`).join('');variantBox.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{chosen=Number(b.dataset.i);renderVariants();updatePriceAndOrder();}));}
 function updatePriceAndOrder(){const v=variants[chosen];document.getElementById('price').textContent=v.price?'PKR '+Number(v.price).toLocaleString('en-PK'):'Price not added';const msg=`Assalam-o-Alaikum, I am interested in ${phone.name}, variant ${v.label}. Please confirm current price and availability. — Awan Mobiles`;document.getElementById('order').href='https://wa.me/923401929013?text='+encodeURIComponent(msg);}
 document.getElementById('specRows').innerHTML=phone.specs.map((sp,i)=>`<div class="specrow"><span>${['Display','Camera','Front Camera','Battery / Features','Connectivity / Details'][i]||'Feature'}</span><strong>${sp}</strong></div>`).join('');renderVariants();updatePriceAndOrder();
}
</script></body></html>
